<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио — GwebStudio</title>
<meta name="description" content="Работы GwebStudio: сайты для бизнеса и PWA-приложения.">
<meta name="theme-color" content="#f4f3ef">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.className += " js";</script>
</head>
<body data-page="portfolio">
<script>try{if(!sessionStorage.getItem("gws")){sessionStorage.setItem("gws","1");document.write('<div class="intro" aria-hidden="true"><span>G<i>web</i>Studio</span></div>');}}catch(e){}</script>
<div id="site-header"></div>

<main id="main">
  <div class="page-hero">
    <div class="wrap" data-bg="Работы">
      <h1 data-split>Портфолио</h1>
      <p data-reveal style="--d:.5s">Сайты и PWA-приложения. Нажмите на любую работу, чтобы открыть кейс с описанием, технологиями и ссылками.</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="filters" id="filters" data-reveal>
        <button class="chip" type="button" data-cat="all" aria-pressed="true">Все</button>
        <button class="chip" type="button" data-cat="web" aria-pressed="false">Сайты</button>
        <button class="chip" type="button" data-cat="app" aria-pressed="false">Приложения</button>
        <button class="sw" type="button" role="switch" aria-checked="false"><i></i>Только реальные</button>
      </div>
      <div class="grid" id="works"></div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
