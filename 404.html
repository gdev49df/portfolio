<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена — GwebStudio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3ef">
<script>
  // на github pages сайт может лежать в подпапке, поэтому задаём базовый путь
  var seg = location.pathname.split("/")[1];
  document.write('<base href="' + (location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/") + '">');
</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>(function(){var s="dark";try{s=localStorage.getItem("gws-style")==="light"?"light":"dark"}catch(e){}document.write('<link id="theme-css" rel="stylesheet" href="/css/'+s+'.css">')})()</script><noscript><link rel="stylesheet" href="/css/dark.css"></noscript>
<script>document.documentElement.className += " js";</script>
</head>
<body data-page="404">
<script>try{if(!sessionStorage.getItem("gws")){sessionStorage.setItem("gws","1");document.write('<div class="intro" aria-hidden="true"><span>G<i>web</i>Studio</span></div>');}}catch(e){}</script>
<div id="site-header"></div>
<main id="main">
  <div class="nf">
    <div data-bg="Ошибка">
      <h1 data-split>404</h1>
      <p data-reveal style="--d:.6s">Такой страницы нет. Возможно, ссылка устарела.</p>
      <a class="btn" href="/" data-reveal style="--d:.8s">На главную</a>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
